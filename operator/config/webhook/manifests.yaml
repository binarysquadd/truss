---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: mutating-webhook-configuration
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /mutate-apps-truss-binarysquad-org-v1alpha1-trussinstance
  failurePolicy: Fail
  name: mtrussinstance-v1alpha1.kb.io
  rules:
  - apiGroups:
    - apps.truss.binarysquad.org
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - trussinstances
  sideEffects: None
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: validating-webhook-configuration
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: webhook-service
      namespace: system
      path: /validate-apps-truss-binarysquad-org-v1alpha1-trussinstance
  failurePolicy: Fail
  name: vtrussinstance-v1alpha1.kb.io
  rules:
  - apiGroups:
    - apps.truss.binarysquad.org
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - trussinstances
  sideEffects: None
