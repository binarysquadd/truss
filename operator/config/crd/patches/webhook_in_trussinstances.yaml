# Enables the conversion webhook on the TrussInstance CRD. The service
# name/namespace below are placeholders overwritten by the replacements in
# config/default/kustomization.yaml (sourced from the real webhook Service), and
# the CA bundle is injected by cert-manager via the inject-ca-from annotation.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: trussinstances.apps.truss.binarysquad.org
spec:
  conversion:
    strategy: Webhook
    webhook:
      conversionReviewVersions:
      - v1
      clientConfig:
        service:
          namespace: system
          name: webhook-service
          path: /convert
