apiVersion: v1
kind: Service
metadata:
  name: truss-dashboard
spec:
  selector: { app: truss-dashboard }
  ports: [{ port: 8080, targetPort: 8080 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: truss-dashboard
spec:
  replicas: 1
  selector:
    matchLabels: { app: truss-dashboard }
  template:
    metadata:
      labels: { app: truss-dashboard }
    spec:
      containers:
        - name: dashboard
          image: "{{ .Values.images.dashboard.repository }}:{{ .Values.images.dashboard.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          # Unprivileged nginx (nginxinc/nginx-unprivileged): runs as uid 101 on :8080
          # and needs no Linux capabilities, so it can be fully hardened.
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities: { drop: ["ALL"] }
            seccompProfile: { type: RuntimeDefault }
          ports: [{ containerPort: 8080 }]
          readinessProbe: { httpGet: { path: /, port: 8080 }, initialDelaySeconds: 5, periodSeconds: 10 }
          resources: {{- toYaml .Values.resources.small | nindent 12 }}
